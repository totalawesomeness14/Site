<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toronto Washrooms & Water</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Washrooms">
<meta name="theme-color" content="#4f46e5">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#fff;--fg:#111827;--muted:#6b7280;--line:#e5e7eb;--chip:#fff;--accent:#4f46e5;--wc:#4f46e5;--water:#0284c7}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1e;--fg:#f3f4f6;--muted:#9ca3af;--line:#3a3a3c;--chip:#2c2c2e;--accent:#818cf8;--wc:#818cf8;--water:#38bdf8}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font:16px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;color:var(--fg);background:var(--bg)}
#map{position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(env(safe-area-inset-top) + 8px) 0 0}
#chips{display:flex;gap:8px;overflow-x:auto;padding:0 12px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:22px;background:var(--chip);color:var(--fg);font:600 15px inherit;font-family:inherit;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.chip.on{background:var(--accent);color:#fff}
#toast{white-space:pre-wrap;word-break:break-word;max-height:30vh;overflow:auto;margin:6px 12px 0;padding:10px 14px;border-radius:12px;background:var(--chip);box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:14px;display:none}
#loc{position:fixed;right:12px;top:calc(env(safe-area-inset-top) + 68px);z-index:1000;width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);color:var(--accent);font-size:22px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.leaflet-top.leaflet-left{top:calc(env(safe-area-inset-top) + 60px)}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:1001;height:var(--h,32dvh);height:var(--h,32vh);background:var(--bg);border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);display:flex;flex-direction:column;transition:height .25s ease}
#sheet.drag{transition:none}
#handle{padding:10px 0 6px;touch-action:none;cursor:grab}
#handle i{display:block;width:40px;height:5px;margin:0 auto;border-radius:3px;background:var(--line)}
#search{margin:0 12px 8px;height:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:var(--chip);color:var(--fg);font:16px inherit;font-family:inherit}
#body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(env(safe-area-inset-bottom) + 12px)}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:64px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left}
.ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:20px}
.wc{background:var(--wc)}.water{background:var(--water)}
.tx{flex:1;min-width:0}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dist{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pill{display:inline-block;margin-top:2px;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.green{background:#16a34a26;color:#16a34a}.red{background:#dc262626;color:#dc2626}.orange{background:#f59e0b26;color:#d97706}
.detail{padding:4px 16px 16px}
.back{min-height:44px;padding:0;border:0;background:none;color:var(--accent);font:600 16px inherit;font-family:inherit}
.detail h2{margin:4px 0 6px;font-size:22px}
.btns{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;min-height:48px;display:grid;place-items:center;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.btn.alt{background:var(--chip);color:var(--accent);border:1px solid var(--line)}
dl{margin:0}dt{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-top:12px}dd{margin:2px 0 0}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{padding:8px 14px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="chips"></div>
  <div id="toast"></div>
</div>
<button id="loc" aria-label="My location">⌖</button>
<section id="sheet">
  <div id="handle"><i></i></div>
  <input id="search" type="search" placeholder="Search park or address" enterkeyhint="search">
  <div id="body"></div>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const CKAN = "https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/package_show?id=";
const SOURCES = [
  {kind: "washroom", slugs: ["washroom-facilities"]},
  {kind: "water", slugs: ["parks-drinking-fountains"]}
];
const DEFAULT = [43.6532, -79.3832];
const FILTERS = [["all", "All"], ["open", "🟢 Open now"], ["washroom", "🚻 Washrooms"], ["water", "💧 Drinking water"], ["bottle", "🚰 Bottle refill"], ["access", "♿ Accessible"]];
const SNAPS = [0.32, 0.6, 0.9];

const S = {feedRows: [], unmatched: [], items: [], filter: "all", q: "", pos: null, sel: null, snap: 0};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");

/* ---------- Map ---------- */
const map = L.map("map", {zoomControl: false, attributionControl: true}).setView(DEFAULT, 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"}).addTo(map);
const layer = L.layerGroup().addTo(map);
map.on("click", () => { if (S.sel) { S.sel = null; render(); setSnap(0); } });
let me = null;

/* ---------- Data ---------- */
function toItem(f, kind, i) {
  const decide = kind === "auto";
  let c = f.geometry && f.geometry.coordinates;
  while (Array.isArray(c) && Array.isArray(c[0])) c = c[0];
  if (!c || c.length < 2) return null;
  const [lon, lat] = c;
  if (!(lat > 43 && lat < 44.5 && lon > -80.5 && lon < -78.5)) return null;
  const props = {};
  for (const [k, v] of Object.entries(f.properties || {})) {
    if (v === null || v === undefined) continue;
    const t = String(v).trim();
    if (t) props[k] = t;
  }
  const find = keys => { for (const w of keys) for (const k in props) if (norm(k) === w) return props[k]; return null; };
  const address = find(["address", "streetaddress"]);
  const hourKey = Object.keys(props).find(k => norm(k).includes("hour"));
  const used = new Set(["name","assetname","facilityname","locationname","parkname","location","address","streetaddress","locationdetails","description","status","alert","statusmessage","servicealert","category","alternativename","assetid","url","website","link","id","objectid","latitude","longitude","lat","lng","lon","x","y","geometry"]);
  const negative = v => ["no","false","0","n","none","n/a"].includes(v.toLowerCase()) || v.toLowerCase().startsWith("not");
  if (decide) {
    const hay = Object.entries(props).filter(([k]) => /type|categ|class/i.test(k)).map(([, v]) => v).join(" ").toLowerCase();
    kind = /drinking|fountain|bottle|water/.test(hay) && !/washroom|restroom|toilet/.test(hay) ? "water" : "washroom";
  }
  return {
    id: kind + i, kind, lat, lon, address,
    bottle: /bottle|refill|fill(er|ing)/i.test(Object.entries(props).filter(([k]) => /type|categ|alternative|name|detail|descr/i.test(k)).map(([, v]) => v).join(" ")),
    props,
    assetId: find(["assetid"]),
    locId: find(["id"]),
    nameKeys: Object.entries(props).filter(([k]) => /^(name|location|alternative_?name|asset_?name)$/i.test(k)).map(([, v]) => norm(v)),
    live: null,
    rawId: find(["assetid", "id", "locationid", "facilityid", "objectid"]),
    name: find(["name","assetname","facilityname","locationname","parkname","location","alternativename"]) || address || (kind === "water" ? "Drinking water" : "Washroom"),
    details: find(["locationdetails", "description"]),
    status: find(["status", "alert", "statusmessage", "servicealert"]),
    url: find(["url", "website", "link"]),
    hours: hourKey ? props[hourKey] : null,
    access: Object.entries(props).some(([k, v]) => /access|universal/.test(norm(k)) && !negative(v))
      || /accessible|universal/i.test(Object.entries(props).filter(([k]) => /type/i.test(k)).map(([, v]) => v).join(" ")),
    extras: Object.entries(props).filter(([k]) => !used.has(norm(k)) && !norm(k).includes("hour"))
      .map(([k, v]) => [k.replace(/_/g, " ").replace(/\b\w/g, m => m.toUpperCase()), v])
  };
}

async function loadKind(src) {
  const errs = [];
  const fromGJ = gj => gj.features.map((f, i) => toItem(f, src.kind, i)).filter(Boolean);
  // Fallback: City Open Data portal (CKAN)
  for (const slug of src.slugs) {
    try {
      const meta = await (await fetch(CKAN + slug)).json();
      const res = meta.result.resources.filter(r => (r.format || "").toLowerCase() === "geojson");
      const pick = res.find(r => (r.name || "").includes("4326")) || res[0];
      const gj = await (await fetch(pick.url)).json();
      try { localStorage.setItem("wf-" + src.kind, JSON.stringify(gj)); } catch (e) {}
      return fromGJ(gj);
    } catch (e) { errs.push(slug + ": " + String(e.message || e)); }
  }
  // 3) Last cached copy
  try { return fromGJ(JSON.parse(localStorage.getItem("wf-" + src.kind))); }
  catch (e) { errs.push("no cache"); }
  const err = new Error(errs.join(" | ")); throw err;
}

const ARC = "https://services3.arcgis.com/b9WvedVPoizGfvfD/arcgis/rest/services/COT_washroom_drinkingwater/FeatureServer/0/query";
const LIVE_STATUS = "https://www.toronto.ca/data/parks/live/washroom_allupdates.json";
let sourceNote = "";

// The City's own map layer: washrooms + drinking water, always current.
async function loadArcGIS() {
  const feats = [];
  for (let offset = 0, n = 0; n < 15; n++) {
    const url = ARC + "?where=1%3D1&outFields=*&outSR=4326&f=geojson&resultOffset=" + offset + "&resultRecordCount=2000";
    const r = await fetch(url + "&_=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const gj = await r.json();
    if (gj.error) throw new Error(gj.error.message || "ArcGIS error");
    const page = gj.features || [];
    feats.push(...page);
    if (!page.length || !(gj.exceededTransferLimit || (gj.properties && gj.properties.exceededTransferLimit))) break;
    offset += page.length;
  }
  const items = feats.map((f, i) => toItem(f, "auto", i)).filter(Boolean);
  if (!items.length) throw new Error("no features");
  return items;
}

const PARTIAL = /\b(east|west|north|south|men|women|male|female|girls|boys|accessible|universal|stall|stalls|sink|sinks|one|single|partial|some|except|only|upper|lower|left|right|side)\b/i;
function liveClosed(L) {           // true when the City's alert means the whole place is closed
  if (L.status === 0) return true;
  if (L.status !== 2) return false;
  const t = (L.reason + " " + L.comments).toLowerCase();
  if (/closed for the season|seasonal|out of service|not (yet )?open/.test(t)) return true;
  return /closed/.test(t) && !/\bopen\b/.test(t) && !PARTIAL.test(t);
}
// The City's live status feed: Status 0 = closed, 1 = open, 2 = service alert.
// Open Data portal datasets that carry the City's status columns (Status 0 = closed, 1 = open, 2 = service alert).
const STATUS_SOURCES = [
  {kind: "washroom", slugs: ["washroom-facilities"], file: "data/washroom.geojson"},
  {kind: "water", slugs: ["parks-drinking-fountains"], file: "data/water.geojson"}
];
async function portalRows(src) {
  const errs = [];
  const hasStatus = fs => fs.some(x => x.properties && x.properties.Status != null && x.properties.Status !== "");
  const keysOf = fs => Object.keys((fs[0] || {}).properties || {}).slice(0, 10).join(",");
  // 1) straight from the Open Data portal, trying every GeoJSON file, then the data table
  for (const slug of src.slugs) {
    try {
      const meta = await (await fetch(CKAN + slug)).json();
      const all = meta.result.resources;
      const geo = all.filter(r => (r.format || "").toLowerCase() === "geojson")
        .sort((x, y) => (y.name || "").includes("4326") - (x.name || "").includes("4326"));
      const tables = all.filter(r => r.datastore_active);
      for (const r of geo.concat(tables)) {
        const label = r.name || r.format || "resource";
        try {
          let fs;
          if ((r.format || "").toLowerCase() === "geojson") {
            fs = (await (await fetch(r.url)).json()).features || [];
          } else {
            const q = await (await fetch("https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action/datastore_search?limit=5000&resource_id=" + r.id)).json();
            fs = (q.result.records || []).map(rec => ({properties: rec}));
          }
          if (hasStatus(fs)) return {features: fs, via: "portal"};
          errs.push(label + ": no Status column (columns: " + keysOf(fs) + ")");
        } catch (e) { errs.push(label + ": " + (e.message || e)); }
      }
    } catch (e) { errs.push(slug + ": " + (e.message || e)); }
  }
  // 2) copy kept on this site, refreshed from the portal by the GitHub workflow
  try {
    const r = await fetch(src.file + "?_=" + Date.now());
    if (!r.ok) throw new Error("HTTP " + r.status);
    const modified = r.headers.get("last-modified");
    const fs = (await r.json()).features || [];
    if (!hasStatus(fs)) throw new Error("no Status column (columns: " + keysOf(fs) + ")");
    return {features: fs, via: "copy", modified: modified ? new Date(modified).toLocaleString("en-CA", {timeZone: "America/Toronto"}) : ""};
  } catch (e) { errs.push("site copy: " + (e.message || e)); }
  throw new Error(errs.join(" | "));
}
async function mergeLive() {
  const notes = [];
  S.unmatched = []; S.feedRows = [];
  const clean = v => (v == null || String(v).trim().toLowerCase() === "none") ? "" : String(v).trim();
  for (const src of STATUS_SOURCES) {
    const pool = S.items.filter(f => f.kind === src.kind);
    try {
      const {features, via, modified} = await portalRows(src);
      const rows = features.map(x => x.properties || {}).filter(p => p.Status != null && p.Status !== "");
      if (!rows.length) throw new Error("no Status column");
      S.feedRows.push(...rows.map(e => ({feed: src.kind, ...e})));
      const byAsset = new Map(), byName = new Map();
      for (const e of rows) {
        const info = {status: Number(e.Status), reason: clean(e.Reason), comments: clean(e.Comments), posted: clean(e.PostedDate).replace("T", " ")};
        if (e.ASSET_ID != null) byAsset.set(String(e.ASSET_ID), info);
        if (e.AssetID != null) byAsset.set(String(e.AssetID), info);
        for (const n of [e.AssetName, e.ALTERNATIVE_NAME]) if (n) byName.set(norm(String(n)), info);
      }
      const used = new Set();
      for (const f of pool) {
        const info = (f.assetId && byAsset.get(f.assetId)) || f.nameKeys.map(k => byName.get(k)).find(Boolean);
        if (info) { f.live = info; used.add(info); }
      }
      const miss = rows.filter(e => { const i = byAsset.get(String(e.ASSET_ID ?? e.AssetID)) || byName.get(norm(String(e.AssetName || e.ALTERNATIVE_NAME || ""))); return !i || !used.has(i); });
      S.unmatched.push(...miss.map(e => `[${src.kind}] ${e.ASSET_ID ?? e.AssetID} | ${e.AssetName || e.ALTERNATIVE_NAME} | status ${e.Status}`));
      notes.push(src.kind + ": " + used.size + "/" + rows.length + " matched, " + (via === "portal" ? "live from the Open Data portal" : "portal copy" + (modified ? " from " + modified : "")));
    } catch (e) {
      notes.push(src.kind + ": no status data (" + (e.message || e) + ")");
    }
  }
  sourceNote += " Status — " + notes.join("; ") + ".";
  drawMarkers(); if (!S.sel) render();
}

async function load() {
  toast("Loading…");
  const why = [];
  let items = [];
  try { items = await loadArcGIS(); sourceNote = "Live from the City’s washroom & drinking water layer."; }
  catch (e) { why.push("City layer → " + e.message); }
  if (!items.length) {
    const failed = [];
    const parts = await Promise.all(SOURCES.map(s => loadKind(s).catch(e => { failed.push(s.kind === "water" ? "drinking water" : "washroom"); why.push(s.kind + " → " + e.message); return []; })));
    items = parts.flat();
    sourceNote = "Loaded from the City Open Data portal.";
    if (failed.length) toast("Couldn’t load " + failed.join(" or ") + " data. Tap to retry.\n" + why.join("\n"));
    else toast("");
  } else toast("");
  S.items = items;
  const w = items.filter(f => f.kind === "washroom").length;
  sourceNote += " " + w + " washrooms, " + (items.length - w) + " drinking water.";
  drawMarkers(); render();
  mergeLive();
}
$("toast").onclick = () => { if ($("toast").textContent.includes("retry")) load(); };
function toast(t) { const el = $("toast"); el.textContent = t; el.style.display = t ? "block" : "none"; }

/* ---------- Open now (from listed hours, Toronto time) ---------- */
const MONTHS = ["jan","feb","mar","apr","may","jun","jul","aug","sep","oct","nov","dec"];
const DAYS = ["sun","mon","tue","wed","thu","fri","sat"];
const MON_RE = MONTHS.join("|"), DAY_RE = DAYS.join("|");
function torontoNow() {
  const p = new Intl.DateTimeFormat("en-CA", {timeZone: "America/Toronto", weekday: "short", month: "numeric", hour: "numeric", minute: "numeric", hourCycle: "h23"}).formatToParts(new Date());
  const g = t => p.find(x => x.type === t).value;
  return {day: DAYS.indexOf(g("weekday").toLowerCase().slice(0, 3)), month: +g("month") - 1, mins: (+g("hour") % 24) * 60 + +g("minute")};
}
const inRange = (v, a, b) => a <= b ? v >= a && v <= b : v >= a || v <= b;   // handles wrap (e.g. Nov–Mar)
function seasonOK(seg, month) {
  const m = seg.match(new RegExp("\\b(" + MON_RE + ")[a-z]*\\.?\\s*(?:to|-|–|—|through|until)\\s*(" + MON_RE + ")[a-z]*", "i"));
  if (!m) return null;
  return inRange(month, MONTHS.indexOf(m[1].toLowerCase()), MONTHS.indexOf(m[2].toLowerCase()));
}
function dayOK(seg, day) {
  if (/\bweekdays?\b/.test(seg)) return day >= 1 && day <= 5;
  if (/\bweekends?\b/.test(seg)) return day === 0 || day === 6;
  const m = seg.match(new RegExp("\\b(" + DAY_RE + ")[a-z]*\\.?(?:\\s*(?:to|-|–|—|through)\\s*(" + DAY_RE + ")[a-z]*)?", "i"));
  if (!m) return true;
  const a = DAYS.indexOf(m[1].toLowerCase()), b = m[2] ? DAYS.indexOf(m[2].toLowerCase()) : a;
  return inRange(day, a, b);
}
const TIME_RE = /(\d{1,2})(?::(\d{2}))?\s*([ap])?\.?m?\.?\s*(?:to|-|–|—|until)\s*(\d{1,2})(?::(\d{2}))?\s*([ap])\.?m\.?/gi;
function openState(f) {            // true = open, false = closed, null = unknown
  if (f.live) {
    if (liveClosed(f.live)) return false;
    return true;
  }
  if (f.status && /closed|out of service|not available/i.test(f.status)) return false;
  const t = (f.hours || "").toLowerCase().replace(/noon/g, "12 p.m.").replace(/midnight/g, "12 a.m.");
  if (!t) return null;
  const now = torontoNow();
  let any = false, open = false, outOfSeason = false, wrongDay = false;
  for (const seg of t.split(/[;\n|]/)) {
    if (seasonOK(seg, now.month) === false) { outOfSeason = true; continue; }
    if (!dayOK(seg, now.day)) { wrongDay = true; continue; }
    if (/24\s*(hours|hrs)|24\s*\/\s*7|all day|always open/.test(seg)) { any = true; open = true; continue; }
    TIME_RE.lastIndex = 0; let m;
    while ((m = TIME_RE.exec(seg))) {
      any = true;
      const eH = +m[4] % 12, sH = +m[1] % 12;
      const ePM = m[6] === "p";
      const sPM = m[3] ? m[3] === "p" : (sH <= eH ? ePM : !ePM);
      const start = (sH + (sPM ? 12 : 0)) * 60 + (+m[2] || 0);
      const end = (eH + (ePM ? 12 : 0)) * 60 + (+m[5] || 0);
      if (end > start ? now.mins >= start && now.mins < end : now.mins >= start || now.mins < end) open = true;
    }
  }
  if (any) return open;
  if (outOfSeason || wrongDay || /closed/.test(t)) return false;
  return null;
}
const openPill = f => {
  const L = f.live;
  if (L && liveClosed(L)) return '<span class="pill red">Closed</span>';
  if (L && L.status === 2) return '<span class="pill orange">Service alert</span>';
  if (L && L.status === 1) return '<span class="pill green">Open</span>';
  const s = openState(f); return s === true ? '<span class="pill green">Open now</span>' : s === false ? '<span class="pill red">Closed now</span>' : ""; };

/* ---------- Helpers ---------- */
function dist(f) {
  const [la, lo] = S.pos || DEFAULT, r = Math.PI / 180;
  const a = Math.sin((f.lat - la) * r / 2) ** 2 + Math.cos(la * r) * Math.cos(f.lat * r) * Math.sin((f.lon - lo) * r / 2) ** 2;
  return 12742000 * Math.asin(Math.sqrt(a));
}
const fmt = m => m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1) + " km";
const pill = s => { if (!s) return ""; const t = s.toLowerCase(); const c = /closed|out of service/.test(t) ? "red" : /open/.test(t) ? "green" : "orange"; return `<span class="pill ${c}">${esc(s)}</span>`; };
const icon = f => f.kind === "water" ? "💧" : "🚻";
const visible = () => S.items.filter(f => S.filter === "all" || (S.filter === "access" ? f.access : S.filter === "open" ? openState(f) === true : S.filter === "bottle" ? f.bottle : f.kind === S.filter));

/* ---------- Rendering ---------- */
function drawMarkers() {
  layer.clearLayers();
  for (const f of visible()) {
    const css = getComputedStyle(document.documentElement).getPropertyValue(f.kind === "water" ? "--water" : "--wc").trim();
    const st = openState(f);
    L.circleMarker([f.lat, f.lon], {radius: 9, color: "#fff", weight: 2, fillColor: st === false ? "#9ca3af" : css, fillOpacity: st === false ? .7 : 1, bubblingMouseEvents: false})
      .on("click", () => select(f)).addTo(layer);
  }
}

function render() {
  const body = $("body");
  if (S.sel) {
    const f = S.sel;
    const dirs = `https://www.google.com/maps/dir/?api=1&destination=${f.lat},${f.lon}&travelmode=walking`;
    const apple = `https://maps.apple.com/?daddr=${f.lat},${f.lon}&dirflg=w`;
    body.innerHTML = `<div class="detail">
      <button class="back" id="back">‹ Back to list</button>
      <div class="sub">${icon(f)} ${f.kind === "water" ? "Drinking water" : "Washroom"} · ${fmt(dist(f))} away</div>
      <h2>${esc(f.name)}</h2>
      ${openPill(f)} ${pill(f.status)} ${f.bottle ? '<span class="pill green">🚰 Bottle refill</span>' : ""} ${f.access ? '<span class="pill green">♿ Accessible</span>' : ""}
      <div class="btns"><a class="btn" href="${apple}">Directions</a>
      <a class="btn alt" href="${dirs}">Google Maps</a>
      ${f.url && /^https?:/.test(f.url) ? `<a class="btn alt" href="${esc(f.url)}">Website</a>` : ""}</div>
      <dl>
        ${f.address ? `<dt>Address</dt><dd>${esc(f.address)}</dd>` : ""}
        ${f.live && (f.live.reason || f.live.comments) ? `<dt>City status update</dt><dd>${esc([f.live.reason, f.live.comments].filter(Boolean).join(" — "))}</dd>${f.live.posted ? `<dd class="sub">Posted ${esc(f.live.posted)}</dd>` : ""}` : ""}
        ${f.hours ? `<dt>Hours</dt><dd>${esc(f.hours)}</dd>${(f.live || openState(f) === null) ? "" : `<dd class="sub">Open/closed is worked out from the listed hours (Toronto time).</dd>`}` : ""}
        ${f.details ? `<dt>Where</dt><dd>${esc(f.details)}</dd>` : ""}
        ${f.extras.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}
      </dl></div>`;
    $("back").onclick = () => { S.sel = null; render(); setSnap(0); };
    return;
  }
  highlight(null);
  const q = S.q.toLowerCase();
  const list = visible()
    .filter(f => !q || `${f.name} ${f.address || ""} ${f.details || ""}`.toLowerCase().includes(q))
    .map(f => [f, dist(f)]).sort((a, b) => a[1] - b[1]).slice(0, 100);
  body.innerHTML = list.length ? list.map(([f, d], i) => `
    <button class="row" data-i="${i}">
      <div class="ic ${f.kind === "water" ? "water" : "wc"}">${icon(f)}</div>
      <div class="tx"><div class="nm">${esc(f.name)}</div><div class="sub">${esc(f.address || (f.kind === "water" ? "Drinking water" : "Washroom"))}</div>${openPill(f)} ${pill(f.status)}${f.bottle ? ' <span class="pill green">🚰 Bottle refill</span>' : ""}${f.access ? " ♿" : ""}</div>
      <div class="dist">${fmt(d)}</div></button>`).join("") + `<div class="foot">${esc(sourceNote)} Map © OpenStreetMap contributors.
      <details><summary>Debug info</summary>
      <p>Feed entries with no match (${S.unmatched.length}):<br>${S.unmatched.slice(0, 25).map(esc).join("<br>")}</p>
      <p><input id="dbgq" placeholder="Type a place name to inspect" style="width:100%;height:40px;padding:0 10px;font-size:16px"></p>
      <pre id="dbgout" style="white-space:pre-wrap;word-break:break-word;font-size:11px"></pre>
      <p>Sample map records:<br>${S.items.slice(0, 4).map(f => esc((f.assetId || "no asset id") + " | " + (f.nameKeys.join(" / ") || f.name))).join("<br>")}</p></details></div>`
    : `<div class="empty">${S.items.length ? "No matches." : "Loading…"}</div>`;
  const dq = $("dbgq");
  if (dq) dq.oninput = () => {
    const q = norm(dq.value);
    const out = $("dbgout");
    if (q.length < 3) { out.textContent = ""; return; }
    const hits = S.items.filter(f => norm(JSON.stringify(f.props)).includes(q)).slice(0, 3).map(f => "MAP: " + JSON.stringify(f.props));
    const feed = S.feedRows.filter(e => norm(JSON.stringify(e)).includes(q)).slice(0, 3).map(e => "FEED: " + JSON.stringify(e));
    out.textContent = (hits.concat(feed).join("\n\n")) || "No match in map data or live feeds (" + S.items.length + " map records, " + S.feedRows.length + " feed rows loaded).";
  };
  body.querySelectorAll(".row").forEach(b => b.onclick = () => select(list[+b.dataset.i][0]));
}

let hl = null;
function highlight(f) {
  if (hl) { map.removeLayer(hl); hl = null; }
  if (f) hl = L.circleMarker([f.lat, f.lon], {radius: 12, color: "#f59e0b", weight: 2.5, fill: false, interactive: false}).addTo(map);
}
function select(f) {
  S.sel = f; render(); setSnap(1);
  const z = Math.max(map.getZoom(), 16), H = innerHeight, topBar = 110;
  // put the point in the middle of the map area that stays visible above the sheet
  const visibleCenter = (topBar + H * (1 - SNAPS[1])) / 2;
  const target = map.unproject(map.project([f.lat, f.lon], z).add([0, H / 2 - visibleCenter]), z);
  map.flyTo(target, z, {duration: .6});
  highlight(f);
  $("body").scrollTop = 0;
}

/* ---------- Chips, search, locate ---------- */
$("chips").innerHTML = FILTERS.map(([k, l]) => `<button class="chip${k === "all" ? " on" : ""}" data-k="${k}">${l}</button>`).join("");
$("chips").onclick = e => {
  const b = e.target.closest(".chip"); if (!b) return;
  S.filter = b.dataset.k; S.sel = null;
  document.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === b));
  drawMarkers(); render();
};
$("search").oninput = e => { S.q = e.target.value; S.sel = null; render(); };
$("search").onfocus = () => setSnap(2);

let centered = false;
function locate(fly) {
  if (!navigator.geolocation) return toast("Location isn’t available in this browser.");
  navigator.geolocation.getCurrentPosition(p => {
    S.pos = [p.coords.latitude, p.coords.longitude];
    if (me) me.setLatLng(S.pos); else me = L.circleMarker(S.pos, {radius: 8, color: "#fff", weight: 3, fillColor: "#2563eb", fillOpacity: 1}).addTo(map);
    if (fly || !centered) map.flyTo(S.pos, 15, {duration: .8});
    centered = true; render();
  }, () => toast("Location permission denied. Showing downtown Toronto."), {enableHighAccuracy: true, timeout: 10000});
}
$("loc").onclick = () => locate(true);

/* ---------- Bottom sheet (tap or drag the handle) ---------- */
const sheet = $("sheet");
function setSnap(i) { S.snap = i; sheet.style.setProperty("--h", SNAPS[i] * 100 + "vh"); }
setSnap(0);
let startY = 0, startH = 0, moved = false;
$("handle").addEventListener("pointerdown", e => {
  startY = e.clientY; startH = sheet.offsetHeight; moved = false;
  sheet.classList.add("drag"); e.target.setPointerCapture && $("handle").setPointerCapture(e.pointerId);
});
$("handle").addEventListener("pointermove", e => {
  if (!sheet.classList.contains("drag")) return;
  const dy = startY - e.clientY; if (Math.abs(dy) > 4) moved = true;
  const h = Math.min(innerHeight * .92, Math.max(innerHeight * .2, startH + dy));
  sheet.style.setProperty("--h", h + "px");
});
$("handle").addEventListener("pointerup", () => {
  sheet.classList.remove("drag");
  if (!moved) return setSnap((S.snap + 1) % SNAPS.length);
  const frac = sheet.offsetHeight / innerHeight;
  setSnap(SNAPS.reduce((b, v, i) => Math.abs(v - frac) < Math.abs(SNAPS[b] - frac) ? i : b, 0));
});

document.addEventListener("visibilitychange", () => { if (!document.hidden) { drawMarkers(); if (!S.sel) render(); } });
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawMarkers);
load(); locate(false);
</script>
</body>
</html>
