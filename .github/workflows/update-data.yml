name: Update status data
on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download City of Toronto Open Data
        run: |
          mkdir -p data
          rm -f data/water.geojson
          CKAN="https://ckan0.cf.opendata.inter.prod-toronto.ca/api/3/action"
          grab() {
            out=$1; shift
            for slug in "$@"; do
              echo "Trying $slug"
              curl -fsSL "$CKAN/package_show?id=$slug" -o meta.json || continue
              jq -r '.result.resources[] | "\(.format) | \(.name) | \(.url)"' meta.json
              jq -r '[.result.resources[] | select((.format|ascii_downcase)=="geojson")] | sort_by(((.name // "")|contains("4326"))|not) | .[].url' meta.json > urls.txt
              while read -r url; do
                [ -n "$url" ] || continue
                curl -fsSL "$url" -o cand.json || continue
                if jq -e '[.features[]?.properties | has("Status")] | any' cand.json > /dev/null; then
                  mv cand.json "data/$out.geojson"; echo "Saved $out from $url"; return 0
                else
                  echo "No Status column in $url"; jq -c '.features[0].properties | keys' cand.json
                fi
              done < urls.txt
            done
            return 1
          }
          grab washroom washroom-facilities || echo "washroom download failed"
          grab water parks-drinking-fountains || echo "water download failed"
          ls -l data
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A data
          git diff --staged --quiet || (git commit -m "Update status data" && git push)
